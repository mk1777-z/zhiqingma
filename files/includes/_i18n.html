<script>
  (function () {
    var NAV_ZH = {
      "Home": "首页",
      "About": "关于",
      "Experience": "实习经历",
      "Projects": "项目",
      "Tech Stack": "技术栈",
      "Awards & Honors": "奖项荣誉",
      "Volunteering": "志愿服务",
      "Contact": "联系方式",
      "Interests": "兴趣爱好",
      "Roller Skating": "轮滑",
      "Running": "跑步",
      "Travel": "旅行"
    };

    var root = document.documentElement;

    function currentLang() {
      return root.classList.contains("lang-zh") ? "zh" : "en";
    }

    function translateNav(lang) {
      document.querySelectorAll(".navbar .menu-text, .navbar .dropdown-text").forEach(function (el) {
        if (!el.dataset.en) el.dataset.en = el.textContent.trim();
        var en = el.dataset.en;
        el.textContent = lang === "zh" && NAV_ZH[en] ? NAV_ZH[en] : en;
      });
    }

    function apply(lang) {
      root.classList.toggle("lang-zh", lang === "zh");
      root.setAttribute("lang", lang === "zh" ? "zh-CN" : "en");
      translateNav(lang);
      var btn = document.getElementById("lang-toggle");
      if (btn) {
        btn.querySelector(".lang-toggle-label").textContent = lang === "zh" ? "EN" : "中文";
        btn.setAttribute("aria-label", lang === "zh" ? "Switch to English" : "切换到中文");
      }
      try { localStorage.setItem("site-lang", lang); } catch (e) {}
    }

    function mountToggle() {
      var btn = document.createElement("button");
      btn.id = "lang-toggle";
      btn.type = "button";
      btn.className = "lang-toggle";
      btn.innerHTML = '<i class="bi bi-translate" aria-hidden="true"></i><span class="lang-toggle-label"></span>';
      btn.addEventListener("click", function () {
        apply(currentLang() === "zh" ? "en" : "zh");
      });

      // Keep the button visible on mobile (outside the collapsed menu), next to the hamburger.
      var toggler = document.querySelector(".navbar .navbar-toggler");
      var tools = document.querySelector(".navbar .quarto-navbar-tools");
      if (toggler && toggler.parentNode) {
        toggler.parentNode.insertBefore(btn, toggler);
      } else if (tools) {
        tools.appendChild(btn);
      } else {
        btn.classList.add("lang-toggle-floating");
        document.body.appendChild(btn);
      }
    }

    function init() {
      mountToggle();
      apply(currentLang());
    }

    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", init);
    } else {
      init();
    }
  })();
</script>
